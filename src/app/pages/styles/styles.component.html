<div class="all-cards-container">
  <div class="header">
    <h1 class="header-title">
      <img class="brand-icon" src="assets/favicon.png" alt="" />
      <span class="brand-text">GeoTrade</span>
    </h1>
  </div>

  <app-navbar></app-navbar>

  <div class="main-content">
    <div class="styles-section">
      <div class="section-header">
        <h2 class="section-title">Style Explorer</h2>
        <p class="section-subtitle">{{ filtered.length }} comparaison{{ filtered.length === 1 ? '' : 's' }}</p>
      </div>

      <div class="filters">
        <div class="filter-row">
          <span class="filter-label">Lieu</span>
          <div class="pills">
            <button class="pill" [class.active]="selectedLocation === 'all'" (click)="selectedLocation = 'all'">Tous</button>
            <button
              *ngFor="let loc of locations"
              class="pill"
              [class.active]="selectedLocation === loc.id"
              (click)="selectedLocation = loc.id">
              {{ loc.label }}
            </button>
          </div>
        </div>

        <div class="filter-row">
          <span class="filter-label">Style</span>
          <div class="pills">
            <button class="pill" [class.active]="selectedStyle === 'all'" (click)="selectedStyle = 'all'">Tous</button>
            <button
              *ngFor="let sty of styles"
              class="pill"
              [class.active]="selectedStyle === sty.id"
              (click)="selectedStyle = sty.id">
              {{ sty.label }}
            </button>
          </div>
        </div>
      </div>

      <div class="image-grid">
        <div
          *ngFor="let pair of filtered"
          class="image-card"
          (click)="openLightbox(pair)">
          <div class="comparison-wrapper">
            <div class="image-wrapper">
              <span class="img-label">Original</span>
              <img [src]="pair.originalPath" [alt]="'Original — ' + pair.locationLabel" loading="lazy" />
            </div>
            <div class="image-wrapper">
              <span class="img-label">{{ pair.styleLabel }}</span>
              <img [src]="pair.styledPath" [alt]="pair.styleLabel + ' — ' + pair.locationLabel" loading="lazy" />
            </div>
          </div>
          <div class="image-meta">
            <span class="meta-style">{{ pair.styleLabel }}</span>
            <span class="meta-dot">·</span>
            <span class="meta-location">{{ pair.locationLabel }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-footer></app-footer>
</div>

<div class="lightbox" *ngIf="lightboxPair" (click)="closeLightbox()">
  <div class="lightbox-inner" (click)="$event.stopPropagation()">
    <button class="lightbox-close" (click)="closeLightbox()">✕</button>
    <div class="lightbox-comparison">
      <div class="lightbox-image-wrapper">
        <span class="lightbox-img-label">Original</span>
        <img [src]="lightboxPair.originalPath" [alt]="'Original — ' + lightboxPair.locationLabel" />
      </div>
      <div class="lightbox-image-wrapper">
        <span class="lightbox-img-label">{{ lightboxPair.styleLabel }}</span>
        <img [src]="lightboxPair.styledPath" [alt]="lightboxPair.styleLabel" />
      </div>
    </div>
    <div class="lightbox-caption">
      <span class="meta-style">{{ lightboxPair.styleLabel }}</span>
      <span class="meta-dot">·</span>
      <span class="meta-location">{{ lightboxPair.locationLabel }}</span>
    </div>
  </div>
</div>
